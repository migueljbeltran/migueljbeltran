<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Miguel Beltran — software engineer, UC Davis CS 2027</title>
  <desc id="desc">A midnight blue retro workstation with a glowing terminal, a controller, and a guitar. Building useful software, from campus systems to game analytics.</desc>
